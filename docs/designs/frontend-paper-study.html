let progressTop=null,progressDragCleanup=null;
// Pure geometry helper; all coordinates are relative to main.
function progressVerticalBounds(mainHeight,headerBottom,composerTop,floatHeight){
const min=Math.max(0,headerBottom+8),bottom=Math.max(min,Math.min(mainHeight,composerTop)-8);
return {min,max:Math.max(min,bottom-floatHeight),available:Math.max(0,bottom-min)};
}
function positionProgress(){
const root=document.querySelector('#progress-preview-root');if(!root||root.hidden)return;
const main=root.parentElement,m=main.getBoundingClientRect(),header=main.querySelector('.topbar').getBoundingClientRect(),composer=main.querySelector('#composer-root').getBoundingClientRect();
const bounds=progressVerticalBounds(m.height,header.bottom-m.top,composer.top-m.top,0),panel=root.querySelector('.progress-panel');
if(panel)panel.style.maxHeight=bounds.available+'px';
const compact=root.querySelector('.progress-drag-compact'),handleOffset=root.classList.contains('is-open')?0:compact?.offsetHeight||0;
const limits=progressVerticalBounds(m.height,header.bottom-m.top,composer.top-m.top,root.offsetHeight+handleOffset);
if(progressTop===null){root.style.top='';progressTop=parseFloat(getComputedStyle(root).top)||120}
const top=Math.max(limits.min+handleOffset,Math.min(limits.max+handleOffset,progressTop));
root.style.top=top+'px';
}
window.addEventListener('resize',positionProgress);
function renderProgressPreview(){
if(progressDragCleanup)progressDragCleanup();
const root=document.querySelector('#progress-preview-root');if(!root)return;
const t=current().topic,skills=t.skills||[],assessed=skills.length>0&&Number.isFinite(t.score);
const row=([name,value])=>`<div class="progress-mini-row"><div class="progress-mini-label"><span>${esc(name)}</span><span>${value}%</span></div><div class="track ${value<60?'weak':''}"><div style="width:${value}%"></div></div></div>`;
const body=assessed?`<div class="progress-overview"><div class="progress-ring" style="--value:${t.score}"><strong>${t.score}%</strong></div><div class="progress-copy">${esc(t.name)}<small>主题总体掌握度</small></div></div>${skills.slice(0,3).map(row).join('')}`:`<div class="progress-unassessed"><strong>${esc(t.name)} · 待评估</strong>从这次对话开始积累学习证据。</div>`;
root.hidden=view!=='chat';root.className='progress-float';
root.innerHTML=`<button type="button" class="progress-drag progress-drag-compact" aria-label="上下拖动学习画像" title="拖动调整高低，或使用上下方向键">↕</button><button type="button" class="progress-trigger" id="progress-trigger" aria-expanded="false" aria-controls="progress-panel" aria-label="展开${esc(t.name)}学习画像，${assessed?t.score+'%掌握度':'待评估'}"><span class="progress-dot" style="--value:${assessed?t.score:0}"></span><b>${assessed?t.score+'%':'—'}</b><span>${assessed?'学习画像':'待评估'}</span></button><section class="progress-panel" id="progress-panel" aria-label="当前主题画像缩略展示" hidden><div class="progress-toolbar"><button type="button" class="progress-drag" aria-label="上下拖动学习画像" title="拖动调整高低，或使用上下方向键">↕</button><span class="progress-caption">学习掌握度 · 示例</span><button class="progress-close" id="progress-close" type="button" aria-label="收起学习画像">×</button></div>${body}<div class="progress-footer">${assessed?'下一步：'+esc(t.focus):'新主题尚未评估'}<br>画像浓缩 · 非课程完成率<button type="button" data-view="profile">查看完整画像 ↗</button></div></section>`;
const trigger=root.querySelector('#progress-trigger'),panel=root.querySelector('#progress-panel');let dismissed=false,drag=null,suppressClick=false;
function setOpen(open){if(drag?.moved)return;root.classList.toggle('is-open',open);trigger.setAttribute('aria-expanded',String(open));panel.hidden=!open;trigger.setAttribute('aria-label',(open?'收起':'展开')+t.name+'学习画像');positionProgress()}
function close(){dismissed=true;setOpen(false);trigger.focus();setOpen(false)}
root.onmouseenter=()=>{if(window.matchMedia('(hover: hover)').matches){dismissed=false;setOpen(true)}};
root.onmouseleave=()=>{if(!drag&&!root.contains(document.activeElement))setOpen(false)};
root.onfocusin=()=>{if(!dismissed)setOpen(true)};
root.onfocusout=e=>{if(!root.contains(e.relatedTarget)){dismissed=false;setOpen(false)}};
trigger.onpointerdown=e=>e.preventDefault();
trigger.onclick=()=>{if(suppressClick>performance.now())return;if(root.classList.contains('is-open'))close();else{dismissed=false;setOpen(true);root.querySelector('#progress-close').focus()}};
root.querySelector('#progress-close').onclick=close;
root.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finishDrag();close()}};
function finishDrag(){if(!drag)return;const previous=drag;drag=null;root.classList.remove('is-dragging');if(previous.handle.hasPointerCapture(previous.id))previous.handle.releasePointerCapture(previous.id);if(previous.moved){suppressClick=performance.now()+350;if(!root.matches(':hover')&&!root.contains(document.activeElement))setOpen(false)}}
progressDragCleanup=()=>{finishDrag();progressDragCleanup=null};
root.querySelectorAll('.progress-drag').forEach(handle=>{
handle.onpointerdown=e=>{if(e.button!==0||drag)return;e.preventDefault();suppressClick=false;drag={id:e.pointerId,handle,y:e.clientY,top:parseFloat(root.style.top),moved:false};handle.setPointerCapture(e.pointerId)};
handle.onpointermove=e=>{if(!drag||drag.id!==e.pointerId)return;const delta=e.clientY-drag.y;if(!drag.moved&&Math.abs(delta)<4)return;drag.moved=true;root.classList.add('is-dragging');progressTop=drag.top+delta;positionProgress();progressTop=parseFloat(root.style.top)};
handle.onpointerup=handle.onpointercancel=handle.onlostpointercapture=e=>{if(drag?.id===e.pointerId)finishDrag()};
handle.onclick=e=>{e.preventDefault();e.stopPropagation();suppressClick=false};
handle.onkeydown=e=>{if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;e.preventDefault();progressTop=parseFloat(root.style.top)+(e.key==='ArrowUp'?-12:12);positionProgress();progressTop=parseFloat(root.style.top)};
});
positionProgress();
}
function sendMessage(e){e.preventDefault();const s=current().session;const text=s.draft.trim();if(!text)return;s.messages.push({role:'user',text},{role:'assistant',text:'【交互演示】已把这条消息加入当前会话。正式功能中，学习伙伴会结合该会话的历史与所属主题画像继续回应；本预览不生成教学内容。'});s.draft='';renderChat();const w=document.querySelector('#workspace');w.scrollTop=w.scrollHeight;document.querySelector('#draft').focus()}
function back(){return '<button class="back" data-view="chat">← 返回当前会话</button>'}
function renderLibrary(){document.querySelector('#workspace').innerHTML=`<div class="content">${back()}<div class="heading-row"><div><div class="eyebrow">THE REFERENCE SHELF</div><h1>知识有来处，思考有回声。</h1><p class="subtitle">收好每一份讲义、笔记与灵感，让它们陪你走得更远。</p></div><button class="button primary" id="add-resource">＋ 添加资料</button></div><div class="stats"><div class="stat"><span class="number">${resources.length}</span><small>份学习资料</small></div><div class="stat"><span class="number">${new Set(resources.map(r=>r.topic)).size}</span><small>个关联主题</small></div><div class="stat"><span class="number">∞</span><small>种新的理解</small></div></div><div class="tools"><label class="search">⌕<input id="library-search" type="search" placeholder="搜索资料名称、说明或主题" aria-label="搜索资料"></label><span class="filter-label">全部资料 · 按主题整理</span></div><div class="cards" id="resource-cards"></div><div class="notice">资料条目为演示数据。真实上传、解析与检索尚未在此预览中接通。</div></div>`;resourceCards('');document.querySelector('#library-search').addEventListener('input',e=>resourceCards(e.target.value))}
function resourceCards(q){const filtered=resources.filter(r=>(r.name+r.desc+topics.find(t=>t.id===r.topic)?.name).toLowerCase().includes(q.toLowerCase()));document.querySelector('#resource-cards').innerHTML=filtered.length?filtered.map(r=>`<article class="resource-card"><button class="remove" data-remove="${r.id}" aria-label="移除演示资料：${esc(r.name)}">×</button><button class="card-open" data-resource="${r.id}"><div class="resource-icon">${r.type==='课程讲义'?'Aa':r.type==='视频笔记'?'▷':'≡'}</div><span class="tag" style="float:right;margin-top:-45px">${esc(topics.find(t=>t.id===r.topic)?.name||'新主题')}</span><h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p><div class="card-footer"><span>${esc(r.type)} · ${esc(r.pages)}</span><span>翻阅 →</span></div></button></article>`).join(''):'<div class="empty">还没找到相关资料。换一个关键词试试。</div>'}
function renderProfile(){const t=topics.find(t=>t.id===profileTopic)||current().topic;profileTopic=t.id;const skills=t.skills||[['基础概念',0],['理解与应用',0],['迁移能力',0],['自主表达',0]];const nodes=t.nodes||['主题探索','基础概念','知识关联','实践应用','问题记录'];document.querySelector('#workspace').innerHTML=`<div class="content">${back()}<div class="heading-row"><div><div class="eyebrow">A PORTRAIT OF YOUR UNDERSTANDING</div><h1>看见理解，慢慢生长。</h1><p class="subtitle">每一次提问、表达与尝试，都留下了一点成长的线索。</p></div><label><span class="sr-only">切换主题画像</span><select class="select" id="profile-topic" data-topic>${options()}</select></label></div><div class="stats"><div class="stat"><span class="number">${t.score||'—'}<span style="font-size:13px">${t.score?'%':''}</span></span><small>主题掌握度 · 示例</small></div><div class="stat"><span class="number">${t.sessions.length}</span><small>个会话共用此画像</small></div><div class="stat"><span class="number">${t.skills?'4':'0'}</span><small>个知识点 · 示例</small></div></div><div class="profile-layout"><div class="paper-box"><h2 class="section-title">${esc(t.name)}<small>理解的轮廓</small></h2>${skills.map(([n,v])=>`<div class="skill-row"><div class="skill-title"><span>${esc(n)}</span><small>${t.skills?v+'%':'待探索'}</small></div><div class="track ${v<60?'weak':''}"><div style="width:${v}%"></div></div></div>`).join('')}<div class="focus-box"><div class="eyebrow">NEXT SMALL STEP</div><h3>${esc(t.focus||'从第一段对话开始')}</h3><p>${esc(t.hint||'新的主题尚无示例评估。你可以先创建问题，再逐步建立理解的线索。')}</p><button class="button" data-session="${t.sessions[0].id}">带着问题继续学习 →</button></div></div><div><div class="paper-box"><h2 class="section-title">知识之间的联系<small>概念关联示意</small></h2><div class="map"><svg viewBox="0 0 300 180" role="img" aria-label="${esc(t.name)}的概念关联示意图"><line x1="150" y1="90" x2="66" y2="35"/><line x1="150" y1="90" x2="236" y2="35"/><line x1="150" y1="90" x2="65" y2="148"/><line x1="150" y1="90" x2="236" y2="148"/><rect x="15" y="19" width="102" height="31" rx="4"/><rect x="185" y="19" width="102" height="31" rx="4"/><rect x="15" y="132" width="102" height="31" rx="4"/><rect x="185" y="132" width="102" height="31" rx="4"/><rect class="core" x="99" y="74" width="102" height="33" rx="4"/><text x="150" y="95" text-anchor="middle">${esc(nodes[0])}</text><text x="66" y="39" text-anchor="middle">${esc(nodes[1])}</text><text x="236" y="39" text-anchor="middle">${esc(nodes[2])}</text><text x="66" y="152" text-anchor="middle">${esc(nodes[3])}</text><text x="236" y="152" text-anchor="middle">${esc(nodes[4])}</text></svg></div><div class="legend">示意关系 · 正式关联应由评估证据支撑</div></div><div class="sources"><h2 class="section-title">理解从这里发生<small>来源会话 · 示例</small></h2>${t.sessions.map((s,i)=>`<div class="source"><span class="date">${i?'10.22':'10.23'}</span><div class="source-copy">${esc(s.title)}<small>${t.skills?(i?'概念辨析 · 形成阶段性理解':'追问与表达 · 发现待巩固知识点'):'尚无评估证据'}</small></div><button data-session="${s.id}" aria-label="打开来源会话：${esc(s.title)}">查看 ↗</button></div>`).join('')}</div></div></div><div class="notice">拟议能力预览：画像按主题与账号绑定，同主题会话共享。分数、概念关联与来源证据均为设计演示，不是对你的真实评估。</div></div>`;document.querySelector('#profile-topic').value=profileTopic;document.querySelector('#profile-topic').addEventListener('change',e=>{profileTopic=e.target.value;renderProfile()})}
function notify(message){const live=document.querySelector('#live');live.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>live.innerHTML='',4000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;if(view==='profile')profileTopic=current().topic.id;render();document.querySelector('#workspace').scrollTop=0}if(b.dataset.session){active=b.dataset.session;view='chat';render();finishSessionSelection()}if(b.dataset.toggle){const el=document.querySelector('#group-'+b.dataset.toggle);el.hidden=!el.hidden;b.setAttribute('aria-expanded',String(!el.hidden));b.querySelector('.chevron').textContent=el.hidden?'›':'⌄'}if(b.matches('[data-close]'))b.closest('dialog').close();if(b.id==='new-session'){document.querySelector('#session-form').reset();document.querySelector('#session-topic').innerHTML=options()+'<option value="new">＋ 新建主题画像</option>';document.querySelector('#session-topic').value=current().topic.id;document.querySelector('#new-topic-fields').hidden=true;document.querySelector('#topic-name').required=false;document.querySelector('#new-dialog').showModal()}if(b.id==='add-resource'){document.querySelector('#resource-form').reset();document.querySelector('#resource-topic').innerHTML=options();document.querySelector('#resource-topic').value=current().topic.id;document.querySelector('#add-dialog').showModal()}if(b.dataset.resource){const r=resources.find(x=>x.id===b.dataset.resource);document.querySelector('#resource-detail').innerHTML=`<div class="eyebrow">ON YOUR SHELF</div><h2>${esc(r.name)}</h2><div class="detail-meta">${esc(r.type)} · ${esc(topics.find(t=>t.id===r.topic).name)} · ${esc(r.pages)}</div><p>${esc(r.desc)}</p><div class="concept">${esc(r.detail)}</div><p class="subtitle">设计演示条目 · 未连接真实文件或检索服务</p><div class="dialog-actions"><button class="button primary" data-close>收好，继续阅读</button></div>`;document.querySelector('#resource-dialog').showModal()}if(b.dataset.remove){resources=resources.filter(r=>r.id!==b.dataset.remove);const q=document.querySelector('#library-search').value;renderLibrary();document.querySelector('#library-search').value=q;resourceCards(q);notify('演示条目已从本页移除，刷新后恢复。')}if(b.id==='sidebar-pin')toggleSidebarPin();if(b.id==='sidebar-collapse'||b.classList.contains('veil'))setSidebarCollapsed(true);if(b.id==='sidebar-expand'||b.classList.contains('mobile-menu'))setSidebarCollapsed(false);if(b.id==='account')document.querySelector('#account-dialog').showModal();if(b.id==='demo-logout'){document.querySelector('#account-dialog').close();notify('退出演示：正式功能将先保存会话，再安全退出账号。')}});
document.querySelector('#session-topic').addEventListener('change',e=>{const isNew=e.target.value==='new';document.querySelector('#new-topic-fields').hidden=!isNew;document.querySelector('#topic-name').required=isNew});document.querySelector('#session-form').addEventListener('submit',e=>{e.preventDefault();const title=document.querySelector('#session-title').value.trim();let id=document.querySelector('#session-topic').value;if(!title)return;if(id==='new'){const name=document.querySelector('#topic-name').value.trim();if(!name)return;id='t'+(++seq);topics.push({id,name,desc:'一段新的探索',sessions:[]})}const t=topics.find(t=>t.id===id);active='s'+(++seq);t.sessions.unshift({id:active,title,time:'刚刚 · 新的探索',draft:'',messages:[{role:'assistant',text:'【交互演示】这是「'+t.name+'」下的新会话。它会保留独立对话与草稿，并与同主题会话共用一份画像。你想先从什么问题开始？'}]});view='chat';document.querySelector('#new-dialog').close();render();finishSessionSelection()});document.querySelector('#resource-form').addEventListener('submit',e=>{e.preventDefault();const name=document.querySelector('#resource-name').value.trim(),desc=document.querySelector('#resource-description').value.trim();if(!name||!desc)return;resources.unshift({id:'r'+(++seq),name,desc,topic:document.querySelector('#resource-topic').value,type:'演示条目',pages:'本页暂存',detail:'此条目仅用于体验资料管理界面，尚未上传真实内容。'});document.querySelector('#add-dialog').close();renderLibrary();notify('演示条目已添加；刷新页面后重置。')});document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('nav-open');updateSidebarState()}});document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}}));render();updateSidebarState();
</script></body></html>
