    excerpt: 西西弗，这个诸神的无产者，无能为力却叛逆反抗，认识到自己苦海无边的生存状况
  - paragraph_id: sisyphus-spine-022-p-0009
    excerpt: 西西弗沉默的喜悦全在于此。他的命运是属于他的。岩石是他的东西。
