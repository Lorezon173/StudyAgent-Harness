- id: sisyphus-l2-007
  level: 2
  question_type: 概念定义
  question: "“荒诞创作”在书中需要满足哪些条件，作品与解释世界之间是什么关系？"
  status: verified_v1
  gold_answer: 荒诞创作必须保持对自身无动机性的清醒，表现分离与反抗，不推崇幻想或激发希望，并抵抗以最终解释或和解结论消除荒诞的诱惑。
  gold_evidence:
  - paragraph_id: sisyphus-spine-018-p-0017
    excerpt: 一种始终如一的荒诞态度，必须对其无动机性保持清醒的意识。
  - paragraph_id: sisyphus-spine-018-p-0017
    excerpt: 假如作品没有表现分离和反抗，假如作品推崇幻想和激发希望，那么作品就不再是无动机的了。
  - paragraph_id: sisyphus-spine-018-p-0018
    excerpt: 解释的诱惑最为强烈的创作中，作者能够克服这种诱惑吗？
