[project]
name = "study-agent-harness"
version = "0.1.0"
description = "StudyAgent Harness - Feynman method multi-agent learning system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-core>=0.3.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.1",  # alembic 同步迁移驱动（async→sync，见 alembic/env.py:22）
    "langfuse>=2.0.0",
    "bcrypt>=4.0",
    "python-jose>=3.3.0",
]

[project.optional-dependencies]
rag = [
    "llama-index>=0.12.0",
    "llama-index-vector-stores-chroma>=0.4.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-postprocessor-sbert-rerank>=0.3.0",
    "chromadb>=0.5.0",
]
eval = [
    "ragas==0.4.3",
    "datasets>=2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.0.0",
    "openai>=1.0.0",
    # ragas 0.4.3 兼容性修复（langchain_community 路径变更），评估之外不直接使用
    "langchain-google-vertexai==3.2.4",
    # ragas default_transforms 内 OverlapScoreBuilder 的隐性依赖
    "rapidfuzz>=3.0.0",
]
worker = [
    "celery>=5.4.0",
    "redis>=5.2.0",
]
ui = [
    "chainlit>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[tool.uv]
index-url = "https://pypi.org/simple/"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require Docker PG + OpenAI API key, deselected by default)",
]
addopts = "-m 'not integration'"
testpaths = ["tests"]


# 与独立工具入口双重固定，避免本地和 CI 使用不同的规则实现。
[tool.ruff]
required-version = "==0.17.1"
target-version = "py311"
preview = false
fix = false
unsafe-fixes = false
extend-exclude = ["artifacts/ruff", ".venv_test"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF"]

# 保留正常中文标点；其它易混淆字符仍由 RUF001/002/003 检查。
allowed-confusables = ["（", "）", "，", "：", "；", "？", "！"]
