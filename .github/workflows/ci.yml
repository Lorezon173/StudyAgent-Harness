name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        # dev extra 含测试工具；Ruff 使用独立精确版本环境
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: python3 scripts/ruff_baseline.py --output artifacts/ruff/ci

      - name: Upload Ruff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-baseline
          path: artifacts/ruff/ci/
          if-no-files-found: warn

      - name: Test (pytest，默认排除 integration)
        run: uv run pytest tests/ -v
